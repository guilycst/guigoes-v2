name: Margo CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and check blog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Build and validate
        run: make check
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: guigoes-site
          path: public/
