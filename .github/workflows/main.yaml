name: Blog CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Build, validate schema and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate content and structured data before packaging
        run: make check dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: guigoes-site-${{ github.sha }}
          path: public/
          if-no-files-found: error
