name: Deploy blog
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the artifact pipeline without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: publication-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  publication:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (inputs.dry_run == true || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'))
    name: Prepare validated publication
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate schema and build the deployment artifact
        run: make check dry-run
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: publication-${{ github.sha }}
          path: |
            public/
            wrangler.toml
          include-hidden-files: true
          if-no-files-found: error
  deploy:
    name: Publish and verify validated artifact
    needs: publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication.outputs.artifact }}
          merge-multiple: true
          path: .
      - name: Validate downloaded publication without rebuilding
        env:
          GOWORK: 'off'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          go run ./cmd/blog check
          npx --no-install wrangler deploy --dry-run --outdir .build/downloaded-output
      - name: Check whether this is still current main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; publication is skipped.'
          fi
      - name: Deploy exact validated publication
        id: publish
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true && steps.current.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          npx --no-install wrangler deploy --message "$GITHUB_SHA"
      - name: Verify the public domain against this exact artifact
        if: steps.publish.outcome == 'success'
        env:
          GOWORK: 'off'
        run: go run ./cmd/blog verify -timeout 3m > .build/production-verification.json
      - name: Preserve production verification receipt
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ github.sha }}
          path: .build/production-verification.json
          if-no-files-found: warn
